[project]
name = "zebra-printer-mcp"
version = "0.3.0"
description = "ZPL label generation + Zebra Link-OS printer control MCP server (Windows, stdio transport). Knowledge grounded in the ZPL II Programming Guide (zpl-zbi2-pg-en-202609)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
# photo -> ZPL only: the core server stays dependency-free for people who just
# want to generate labels from text
# render -> offline ZPL-to-PNG preview so an agent can look at the label; small,
# pure-Python friends of Pillow, no cloud round trip
render = [
    "pillow>=10.0",
    "segno>=1.5",
    "python-barcode>=0.15",
]
photo = [
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
    "zxing-cpp>=2.2",
    "onnxruntime>=1.17",
    "pyclipper>=1.3",
]

[project.scripts]
zebra-printer-mcp = "zebra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zebra_mcp"]
