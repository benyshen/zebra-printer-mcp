[project]
name = "zebra-printer-mcp"
version = "0.4.0"
description = "MCP server shell for ZPL label generation and Zebra Link-OS printing. The engine lives in zpl-core; this package only exposes it as 9 MCP tools."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "zpl-core>=0.1.0",
]

[project.optional-dependencies]
# render -> offline ZPL-to-PNG so an agent can look at the label before printing
render = ["zpl-core[render]>=0.1.0"]
# photo -> label photo to ZPL (PP-OCRv4 weights ship inside zpl-core)
photo = ["zpl-core[ocr]>=0.1.0"]
all = ["zpl-core[all]>=0.1.0"]

[project.scripts]
zebra-printer-mcp = "zebra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zebra_mcp"]
